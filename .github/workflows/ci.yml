name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer Xcode 27 beta / default; fall back to newest installed.
          if [ -d "/Applications/Xcode-27.0.0-beta.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode-27.0.0-beta.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Swift build + test
        run: ./scripts/check.sh
